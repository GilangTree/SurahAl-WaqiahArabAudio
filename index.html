tin-na'iim",arti:"berada dalam surga kenikmatan,"},{no:13,arab:"ثُلَّةٌ مِنَ الْأَوَّلِينَ",latin:"Tsullatum minal-awwaliin",arti:"segolongan besar dari orang-orang yang terdahulu,"},{no:14,arab:"وَقَلِيلٌ مِنَ الْآخِرِينَ",latin:"Wa qaliilum minal-aakhiriin",arti:"dan segolongan kecil dari orang-orang yang kemudian."},{no:15,arab:"عَلَىٰ سُرُرٍ مَوْضُونَةٍ",latin:"'Alaa sururim mawdhoonah",arti:"Mereka berada di atas dipan-dipan yang bertatahkan emas dan permata,"},{no:16,arab:"مُتَّكِئِينَ عَلَيْهَا مُتَقَابِلِينَ",latin:"Muttaki'iina 'alaihaa mutaqaabiliin",arti:"mereka bersandar di atasnya berhadap-hadapan."},{no:17,arab:"يَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُخَلَّدُونَ",latin:"Yathoofu 'alaihim wildaanum mukhalladoon",arti:"Mereka dikelilingi anak-anak muda yang tetap muda,"},{no:18,arab:"بِأَكْوَابٍ وَأَبَارِيقَ وَكَأْسٍ مِنْ مَعِينٍ",latin:"Bi-akwaabiw wa abaariiqo wa ka'sim mim-ma'iin",arti:"dengan membawa gelas, cerek, dan sloki (berisi) minuman yang diambil dari air yang mengalir,"},{no:19,arab:"لَا يُصَدَّعُونَ عَنْهَا وَلَا يُنْزِفُونَ",latin:"Laa yushadda'oona 'anhaa wa laa yunzifoon",arti:"mereka tidak pening karenanya dan tidak pula mabuk."},{no:20,arab:"وَفَاكِهَةٍ مِمَّا يَتَخَيَّرُونَ",latin:"Wa faakihatim mimmaa yatakhayyaroon",arti:"Dan buah-buahan apapun yang mereka pilih,"},{no:21,arab:"وَلَحْمِ طَيْرٍ مِمَّا يَشْتَهُونَ",latin:"Wa lahmi thairim mimmaa yashtahoon",arti:"dan daging burung apapun yang mereka inginkan."},{no:22,arab:"وَحُورٌ عِينٌ",latin:"Wa huurun 'iin",arti:"Dan (di dalam surga itu) ada bidadari-bidadari yang bermata indah,"},{no:23,arab:"كَأَمْثَالِ اللُّؤْلُؤِ الْمَكْنُونِ",latin:"Ka-amtsaalil-lu'lu'il-maknoon",arti:"laksana mutiara yang tersimpan baik."},{no:24,arab:"جَزَاءً بِمَا كَانُوا يَعْمَلُونَ",latin:"Jazaa'am bimaa kaanoo ya'maloon",arti:"Sebagai balasan atas apa yang mereka kerjakan."},{no:25,arab:"لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا تَأْثِيمًا",latin:"Laa yasma'oona fiihaa laghwaw wa laa ta'tsiimaa",arti:"Di sana mereka tidak mendengar percakapan yang sia-sia maupun yang menimbulkan dosa,"},{no:26,arab:"إِلَّا قِيلًا سَلَامًا سَلَامًا",latin:"Illaa qiilan salaaman salaamaa",arti:"tetapi mereka mendengar ucapan salam, 'Salam, Salam.'"},{no:27,arab:"وَأَصْحَابُ الْيَمِينِ مَا أَصْحَابُ الْيَمِينِ",latin:"Wa ash-haabul yamiini maa ash-haabul yamiin",arti:"Dan golongan kanan, alangkah mulianya golongan kanan itu."},{no:28,arab:"فِي سِدْرٍ مَخْضُودٍ",latin:"Fii sidrim makhdood",arti:"(Mereka) berada di antara pohon bidara yang tidak berduri,"},{no:29,arab:"وَطَلْحٍ مَنْضُودٍ",latin:"Wa thalhim mandhood",arti:"dan pohon pisang yang bersusun-susun (buahnya),"},{no:30,arab:"وَظِلٍّ مَمْدُودٍ",latin:"Wa zhillim mamdood",arti:"dan naungan yang terbentang luas,"},{no:31,arab:"وَمَاءٍ مَسْكُوبٍ",latin:"Wa maa'im maskoob",arti:"dan air yang tercurah,"},{no:32,arab:"وَفَاكِهَةٍ كَثِيرَةٍ",latin:"Wa faakihatin katsiirah",arti:"dan buah-buahan yang banyak,"},{no:33,arab:"لَا مَقْطُوعَةٍ وَلَا مَمْنُوعَةٍ",latin:"Laa maqthoo'atiw wa laa mamnoo'ah",arti:"yang tidak berhenti berbuah dan tidak terlarang mengambilnya,"},{no:34,arab:"وَفُرُشٍ مَرْفُوعَةٍ",latin:"Wa furusyim marfoo'ah",arti:"dan kasur-kasur yang tebal lagi empuk."},{no:35,arab:"إِنَّا أَنْشَأْنَاهُنَّ إِنْشَاءً",latin:"Innaa ansya'naahunna insyaa'aa",arti:"Kami menciptakan mereka (bidadari-bidadari itu) secara langsung,"},{no:36,arab:"فَجَعَلْنَاهُنَّ أَبْكَارًا",latin:"Faja'alnaahunna abkaaraa",arti:"lalu Kami jadikan mereka perawan-perawan,"},{no:37,arab:"عُرُبًا أَتْرَابًا",latin:"'Uruban atraabaa",arti:"yang penuh cinta (kepada suaminya) lagi sebaya umurnya,"},{no:38,arab:"لِأَصْحَابِ الْيَمِينِ",latin:"Li-ash-haabil yamiin",arti:"untuk golongan kanan,"},{no:39,arab:"ثُلَّةٌ مِنَ الْأَوَّلِينَ",latin:"Tsullatum minal-awwaliin",arti:"(yaitu) segolongan besar dari orang-orang yang terdahulu,"},{no:40,arab:"وَثُلَّةٌ مِنَ الْآخِرِينَ",latin:"Wa tsullatum minal-aakhiriin",arti:"dan segolongan besar pula dari orang-orang yang kemudian."},{no:41,arab:"وَأَصْحَابُ الشِّمَالِ مَا أَصْحَابُ الشِّمَالِ",latin:"Wa ash-haabusy-syimaali maa ash-haabusy-syimaal",arti:"Dan golongan kiri, alangkah sengsaranya golongan kiri itu."},{no:42,arab:"فِي سَمُومٍ وَحَمِيمٍ",latin:"Fii samoomiw wa hamiim",arti:"(Mereka) dalam siksaan angin yang sangat panas dan air yang mendidih,"},{no:43,arab:"وَظِلٍّ مِنْ يَحْمُومٍ",latin:"Wa zhillim miy yahmoom",arti:"dan naungan asap yang hitam,"},{no:44,arab:"لَا بَارِدٍ وَلَا كَرِيمٍ",latin:"Laa baaridiw wa laa kariim",arti:"tidak sejuk dan tidak menyenangkan."},{no:45,arab:"إِنَّهُمْ كَانُوا قَبْلَ ذَٰلِكَ مُتْرَفِينَ",latin:"Innahum kaanoo qabla dzaalika mutrafiin",arti:"Sesungguhnya mereka sebelum itu (dahulu) hidup bermewah-mewah,"},{no:46,arab:"وَكَانُوا يُصِرُّونَ عَلَى الْحِنْثِ الْعَظِيمِ",latin:"Wa kaanoo yushirroona 'alal-hintsil 'azhiim",arti:"dan mereka terus-menerus mengerjakan dosa yang besar,"},{no:47,arab:"وَكَانُوا يَقُولُونَ أَئِذَا مِتْنَا وَكُنَّا تُرَابًا وَعِظَامًا أَإِنَّا لَمَبْعُوثُونَ",latin:"Wa kaanoo yaqooloona a-idzaa mitnaa wa kunnaa turaabaw wa 'izhaaman a-innaa lamab'ootsuun",arti:"dan mereka berkata, 'Apabila kami mati dan menjadi tanah dan tulang-belulang, apakah kami benar-benar akan dibangkitkan kembali?'"},{no:48,arab:"أَوَآبَاؤُنَا الْأَوَّلُونَ",latin:"Awa aabaa'unal-awwaluun",arti:"Apakah bapak-bapak kami yang terdahulu (juga)?'"},{no:49,arab:"قُلْ إِنَّ الْأَوَّلِينَ وَالْآخِرِينَ",latin:"Qul innal-awwaliina wal-aakhiriin",arti:"Katakanlah, '(Ya), sesungguhnya orang-orang yang terdahulu dan yang kemudian,'"},{no:50,arab:"لَمَجْمُوعُونَ إِلَىٰ مِيقَاتِ يَوْمٍ مَعْلُومٍ",latin:"Lamajmoo'oona ilaa miiqaati yaumim ma'loom",arti:"pasti semua akan dikumpulkan pada waktu tertentu, pada hari yang sudah dimaklumi."},{no:51,arab:"ثُمَّ إِنَّكُمْ أَيُّهَا الضَّالُّونَ الْمُكَذِّبُونَ",latin:"Tsumma innakum ayyuhadh-dhaalloonal-mukadzdziboon",arti:"Kemudian sesungguhnya kamu, wahai orang-orang yang sesat lagi mendustakan!"},{no:52,arab:"لَآكِلُونَ مِنْ شَجَرٍ مِنْ زَقُّومٍ",latin:"La-aakiloona min syajarim min zaqqoom",arti:"pasti akan memakan pohon zaqqum,"},{no:53,arab:"فَمَالِئُونَ مِنْهَا الْبُطُونَ",latin:"Famaali'oona minhaal-buthoon",arti:"maka akan penuh perutmu dengannya."},{no:54,arab:"فَشَارِبُونَ عَلَيْهِ مِنَ الْحَمِيمِ",latin:"Fasyaariboona 'alaihi minal-hamiim",arti:"Setelah itu kamu akan meminum air yang sangat panas."},{no:55,arab:"فَشَارِبُونَ شُرْبَ الْهِيمِ",latin:"Fasyaariboona syurbal-hiim",arti:"Maka kamu minum seperti unta (yang sangat haus) minum."},{no:56,arab:"هَٰذَا نُزُلُهُمْ يَوْمَ الدِّينِ",latin:"Haadzaa nuzuluhum yaumad-diin",arti:"Itulah hidangan untuk mereka pada hari Pembalasan."},{no:57,arab:"نَحْنُ خَلَقْنَاكُمْ فَلَوْلَا تُصَدِّقُونَ",latin:"Nahnu khalaqnaakum falau laa tushaddiqoon",arti:"Kami telah menciptakan kamu, mengapa kamu tidak membenarkan (hari berbangkit)?"},{no:58,arab:"أَفَرَأَيْتُمْ مَا تُمْنُونَ",latin:"Afara'aitum maa tumnuun",arti:"Maka adakah kamu perhatikan tentang (air) mani yang kamu pancarkan?"},{no:59,arab:"أَأَنْتُمْ تَخْلُقُونَهُ أَمْ نَحْنُ الْخَالِقُونَ",latin:"A-antum takhluqoonahu am nahnul-khaaliqoon",arti:"Kamukah yang menciptakannya, ataukah Kami penciptanya?"},{no:60,arab:"نَحْنُ قَدَّرْنَا بَيْنَكُمُ الْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ",latin:"Nahnu qaddarnaa bainakumul-mauta wa maa nahnu bimasbooqiin",arti:"Kami telah menentukan kematian di antara kamu dan Kami tidak lemah,"},{no:61,arab:"عَلَىٰ أَنْ نُبَدِّلَ أَمْثَالَكُمْ وَنُنْشِئَكُمْ فِي مَا لَا تَعْلَمُونَ",latin:"'Alaa an nubaddila amtsaalakum wa nunsyi'akum fii maa laa ta'lamoon",arti:"untuk menggantikan kamu dengan orang-orang yang seperti kamu (di dunia) dan membangkitkan kamu kelak (di akhirat) dalam keadaan yang tidak kamu ketahui."},{no:62,arab:"وَلَقَدْ عَلِمْتُمُ النَّشْأَةَ الْأُولَىٰ فَلَوْلَا تَذَكَّرُونَ",latin:"Wa laqad 'alimtumun-nasy'atal-oolaa falau laa tadzakkaroon",arti:"Dan sungguh, kamu telah tahu penciptaan yang pertama, mengapa kamu tidak mengambil pelajaran?"},{no:63,arab:"أَفَرَأَيْتُمْ مَا تَحْرُثُونَ",latin:"Afara'aitum maa tahrutsuun",arti:"Pernahkah kamu perhatikan benih yang kamu tanam?"},{no:64,arab:"أَأَنْتُمْ تَزْرَعُونَهُ أَمْ نَحْنُ الزَّارِعُونَ",latin:"A-antum tazra'oonahu am nahnuz-zaari'oon",arti:"Kamukah yang menumbuhkannya ataukah Kami yang menumbuhkan?"},{no:65,arab:"لَوْ نَشَاءُ لَجَعَلْنَاهُ حُطَامًا فَظَلْتُمْ تَفَكَّهُونَ",latin:"Lau nasyaa'u laja'alnaahu huthaaman fazhaltum tafakkahuun",arti:"Sekiranya Kami kehendaki, niscaya Kami jadikan tanaman itu kering dan hancur; maka kamu akan heran tercengang,"},{no:66,arab:"إِنَّا لَمُغْرَمُونَ",latin:"Innaa lamughramoon",arti:"(sambil berkata), 'Sungguh, kami benar-benar menderita kerugian,'"},{no:67,arab:"بَلْ نَحْنُ مَحْرُومُونَ",latin:"Bal nahnu mahroomoon",arti:"bahkan kami tidak mendapat hasil apa pun."},{no:68,arab:"أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ",latin:"Afara'aitumul-maa'alladzii tasyraboon",arti:"Pernahkah kamu memperhatikan air yang kamu minum?"},{no:69,arab:"أَأَنْتُمْ أَنْزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنْزِلُونَ",latin:"A-antum anzaltumoohu minal-muzni am nahnul-munziloon",arti:"Kamukah yang menurunkannya dari awan ataukah Kami yang menurunkan?"},{no:70,arab:"لَوْ نَشَاءُ جَعَلْنَاهُ أُجَاجًا فَلَوْلَا تَشْكُرُونَ",latin:"Lau nasyaa'u ja'alnaahu ujaajan falau laa tasykuroon",arti:"Sekiranya Kami menghendaki, niscaya Kami jadikan air itu asin, mengapa kamu tidak bersyukur?"},{no:71,arab:"أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ",latin:"Afara'aitumun-naarallatii tooroon",arti:"Maka pernahkah kamu memperhatikan tentang api yang kamu nyalakan (dengan kayu)?"},{no:72,arab:"أَأَنْتُمْ أَنْشَأْتُمْ شَجَرَتَهَا أَمْ نَحْنُ الْمُنْشِئُونَ",latin:"A-antum ansya'tum syajaratahaa am nahnul-munsyi'oon",arti:"Kamukah yang menumbuhkan kayu itu ataukah Kami yang menumbuhkan?"},{no:73,arab:"نَحْنُ جَعَلْنَاهَا تَذْكِرَةً وَمَتَاعًا لِلْمُقْوِينَ",latin:"Nahnu ja'alnaahaa tadzkirataw wa mataa'al lil-muqwiin",arti:"Kami menjadikannya (api itu) untuk peringatan dan bahan yang berguna bagi musafir."},{no:74,arab:"فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ",latin:"Fasabbih bismi rabbikal-'azhiim",arti:"Maka bertasbihlah dengan (menyebut) nama Tuhanmu Yang Mahabesar."},{no:75,arab:"فَلَا أُقْسِمُ بِمَوَاقِعِ النُّجُومِ",latin:"Falaa uqsimu bimawaaqi'in-nujoom",arti:"Maka Aku bersumpah demi tempat beredarnya bintang-bintang."},{no:76,arab:"وَإِنَّهُ لَقَسَمٌ لَوْ تَعْلَمُونَ عَظِيمٌ",latin:"Wa innahu laqasamul lau ta'lamoona 'azhiim",arti:"Dan sesungguhnya itu benar-benar sumpah yang besar sekiranya kamu mengetahui,"},{no:77,arab:"إِنَّهُ لَقُرْآنٌ كَرِيمٌ",latin:"Innahu laqur'aanun kariim",arti:"dan (ini) sesungguhnya Al-Qur'an yang sangat mulia,"},{no:78,arab:"فِي كِتَابٍ مَكْنُونٍ",latin:"Fii kitaabim maknoon",arti:"dalam Kitab yang terpelihara (Lauh Mahfuzh),"},{no:79,arab:"لَا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ",latin:"Laa yamassuhu illal-muthahharoon",arti:"tidak ada yang menyentuhnya selain hamba-hamba yang disucikan."},{no:80,arab:"تَنْزِيلٌ مِنْ رَبِّ الْعَالَمِينَ",latin:"Tanziilum mir rabbil-'aalamiin",arti:"Diturunkan dari Tuhan seluruh alam."},{no:81,arab:"أَفَبِهَٰذَا الْحَدِيثِ أَنْتُمْ مُدْهِنُونَ",latin:"Afabihaadzal-hadiitsi antum mudhinoon",arti:"Apakah kamu menganggap remeh berita ini (Al-Qur'an)?"},{no:82,arab:"وَتَجْعَلُونَ رِزْقَكُمْ أَنَّكُمْ تُكَذِّبُونَ",latin:"Wa taj'aloona rizqakum annakum tukadzdziboon",arti:"dan kamu menjadikan rezeki yang kamu terima (dari Allah) justru untuk mendustakan(-Nya)."},{no:83,arab:"فَلَوْلَا إِذَا بَلَغَتِ الْحُلْقُومَ",latin:"Falau laa idzaa balaghatil-hulqoom",arti:"Maka kalau begitu mengapa (tidak mencegah) ketika (nyawa) telah sampai di kerongkongan,"},{no:84,arab:"وَأَنْتُمْ حِينَئِذٍ تَنْظُرُونَ",latin:"Wa antum hiina'idzin tanzhuroon",arti:"dan kamu ketika itu melihat,"},{no:85,arab:"وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْكُمْ وَلَٰكِنْ لَا تُبْصِرُونَ",latin:"Wa nahnu aqrabu ilaihi minkum wa laakin laa tubshiroon",arti:"dan Kami lebih dekat kepadanya daripada kamu, tetapi kamu tidak melihat,"},{no:86,arab:"فَلَوْلَا إِنْ كُنْتُمْ غَيْرَ مَدِينِينَ",latin:"Falau laa in kuntum ghaira madiiniin",arti:"maka mengapa jika kamu memang tidak dikuasai (oleh Allah),"},{no:87,arab:"تَرْجِعُونَهَا إِنْ كُنْتُمْ صَادِقِينَ",latin:"Tarji'oonahaa in kuntum shaadiqiin",arti:"kamu tidak mengembalikannya (nyawa itu) jika kamu orang yang benar?"},{no:88,arab:"فَأَمَّا إِنْ كَانَ مِنَ الْمُقَرَّبِينَ",latin:"Fa-ammaa in kaana minal-muqarrabiin",arti:"Jika dia (orang yang mati itu) termasuk yang didekatkan (kepada Allah),"},{no:89,arab:"فَرَوْحٌ وَرَيْحَانٌ وَجَنَّتُ نَعِيمٍ",latin:"Farauhuwwa raihaanuwwa jannatu na'iim",arti:"maka dia memperoleh ketenteraman dan rezeki serta surga (yang penuh) kenikmatan."},{no:90,arab:"وَأَمَّا إِنْ كَانَ مِنْ أَصْحَابِ الْيَمِينِ",latin:"Wa ammaa in kaana min ash-haabil yamiin",arti:"Dan adapun jika dia termasuk golongan kanan,"},{no:91,arab:"فَسَلَامٌ لَكَ مِنْ أَصْحَابِ الْيَمِينِ",latin:"Fasalaamul laka min ash-haabil yamiin",arti:"maka, 'Salam bagimu' (wahai) dari golongan kanan! (Sambutan dari mereka)."},{no:92,arab:"وَأَمَّا إِنْ كَانَ مِنَ الْمُكَذِّبِينَ الضَّالِّينَ",latin:"Wa ammaa in kaana minal-mukadzdzibiinadh-dhaalliin",arti:"Dan adapun jika dia termasuk golongan orang yang mendustakan lagi sesat,"},{no:93,arab:"فَنُزُلٌ مِنْ حَمِيمٍ",latin:"Fanuzulum min hamiim",arti:"maka dia disambut siraman air yang mendidih,"},{no:94,arab:"وَتَصْلِيَةُ جَحِيمٍ",latin:"Wa tashliyatu jahiim",arti:"dan dibakar di dalam neraka."},{no:95,arab:"إِنَّ هَٰذَا لَهُوَ حَقُّ الْيَقِينِ",latin:"Inna haadzaa lahuwa haqqul-yaqiin",arti:"Sungguh, inilah keyakinan yang benar."},{no:96,arab:"فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ",latin:"Fasabbih bismi rabbikal-'azhiim",arti:"Maka bertasbihlah dengan (menyebut) nama Tuhanmu Yang Mahabesar."}];function Ni(){let[e,t]=W.useState(!1),[n,r]=W.useState(!0),[l,u]=W.useState(!0),[o,i]=W.useState(32),[s,c]=W.useState(!0),[m,h]=W.useState(!0),[p,w]=W.useState(1),[S,_]=W.useS
