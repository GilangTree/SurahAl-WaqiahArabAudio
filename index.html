<script>
const DB = {
  name: 'quran-offline-v2',
  store: 'audios',

  open() {
    return new Promise((ok, err) => {
      const r = indexedDB.open(this.name, 2);
      r.onupgradeneeded = () => {
        if (!r.result.objectStoreNames.contains(this.store))
          r.result.createObjectStore(this.store);
      };
      r.onsuccess = () => ok(r.result);
      r.onerror   = () => err(r.error);
    });
  },

  async get(key) {
    const db = await this.open();
    return new Promise((ok, err) => {
      const r = db.transaction(this.store,'readonly')
                  .objectStore(this.store).get(key);
      r.onsuccess = () => ok(r.result || null);
      r.onerror   = () => err(r.error);
    });
  },

  async put(key, val) {
    const db = await this.open();
    return new Promise((ok, err) => {
      const tx = db.transaction(this.store,'readwrite');
      tx.objectStore(this.store).put(val, key);
      tx.oncomplete = ok;
      tx.onerror = () => err(tx.error);
    });
  },

  async has(key) { return !!(await this.get(key)); },

  async clear() {
    const db = await this.open();
    return new Promise((ok, err) => {
      const tx = db.transaction(this.store,'readwrite');
      tx.objectStore(this.store).clear();
      tx.oncomplete = ok;
      tx.onerror = () => err(tx.error);
    });
  },

  async getAllKeys() {
    const db = await this.open();
    return new Promise((ok, err) => {
      const r = db.transaction(this.store,'readonly')
                  .objectStore(this.store).getAllKeys();
      r.onsuccess = () => ok(r.result);
      r.onerror   = () => err(r.error);
    });
  },

  async getAll() {
    const db = await this.open();
    return new Promise((ok, err) => {
      const cur = db.transaction(this.store,'readonly')
                    .objectStore(this.store).openCursor();
      const res = [];
      cur.onsuccess = e => {
        const c = e.target.result;
        if (c) { res.push({ key: c.key, blob: c.value }); c.continue(); }
        else ok(res);
      };
      cur.onerror = () => err(cur.error);
    });
  }
};
</script>

function set(patch) { Object.assign(S, patch); render(); }

// ── Cache state ───────────────────────────────
async function refreshCache() {
  const keys  = await DB.getAllKeys();
  const cache = {};
  keys.forEach(k => { if (typeof k === 'string') cache[k] = true; });
  set({
    cached: cache,
    count:  {
      '056': keys.filter(k => typeof k==='string' && k.startsWith('056-')).length,
      '083': keys.filter(k => typeof k==='string' && k.startsWith('083-')).length
    }
  });
}

// ── Audio ─────────────────────────────────────
async function getUrl(code, num) {
  const key = `${code}-${String(num).padStart(3,'0')}`;
  const blob = await DB.get(key);
  if (blob) {
    if (S.blobUrl) URL.revokeObjectURL(S.blobUrl);
    const url = URL.createObjectURL(blob);
    S.blobUrl = url;
    return url;
  }
  if (!navigator.onLine) return null;
  return `https://everyayah.com/data/Alafasy_128kbps/${code}${String(num).padStart(3,'0')}.mp3`;
}

async function play(num) {
  set({ ayah: num, playing: false });
  const code = SURAHS[S.tab].code;
  const url  = await getUrl(code, num);
  if (!url) { scrollTo(num); return; }
  try {
    audioEl.pause();
    audioEl.src = url;
    audioEl.playbackRate = S.speed;
    const p = audioEl.play();
    if (p?.catch) p.then(() => set({playing:true})).catch(() => set({playing:false}));
    else set({playing:true});
  } catch { set({playing:false}); }
  scrollTo(num);
}

function scrollTo(num) {
  setTimeout(() => ayahNodes[num]?.scrollIntoView({behavior:'smooth',block:'center'}), 100);
}

// ── Download ──────────────────────────────────
async function downloadAll() {
  if (S.loading) return;
  const { code, count } = SURAHS[S.tab];
  set({ loading: true, dlProgress: { cur:0, tot:count, per:{} } });

  // coba download full mp3 dulu
  try {
    if (!await DB.has(`FULL-${code}`)) {
      const r = await fetch(`https://server8.mp3quran.net/afs/${code}.mp3`,
                            { signal: AbortSignal.timeout(10000) });
      if (r.ok) await DB.put(`FULL-${code}`, await r.blob());
    }
  } catch {}

  const per = {};
  for (let i = 1; i <= count; i++) {
    const pad = String(i).padStart(3,'0');
    const key = `${code}-${pad}`;
    if (await DB.has(key)) {
      per[i] = 'done';
      set({ dlProgress: { cur:i, tot:count, per:{...per} } });
      continue;
    }
    per[i] = 'loading';
    set({ dlProgress: { cur:i-1, tot:count, per:{...per} } });
    try {
      const r = await fetch(
        `https://everyayah.com/data/Alafasy_128kbps/${code}${pad}.mp3`,
        { signal: AbortSignal.timeout(15000) }
      );
      if (!r.ok) throw 0;
      await DB.put(key, await r.blob());
      per[i] = 'done';
    } catch { per[i] = 'error'; }
    set({ dlProgress: { cur:i, tot:count, per:{...per} } });
    await new Promise(r => setTimeout(r, 60));
  }
  set({ loading: false });
  await refreshCache();
}

// ── JSZip loader ──────────────────────────────
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((ok, err) => {
    if (!navigator.onLine) { err(new Error('OFFLINE')); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload  = () => window.JSZip ? ok(window.JSZip) : err(new Error('load fail'));
    s.onerror = () => err(new Error('cdn fail'));
    document.head.appendChild(s);
  });
}

// ── Export ────────────────────────────────────
async function exportData() {
  if (S.exporting) return;
  set({ exporting:true, expMsg:'', expProg:{cur:0,tot:0,size:0} });
  const all = await DB.getAll();
  if (!all.length) { set({exporting:false, expMsg:'Belum ada audio. Download dulu.'}); return; }
  let JSZip;
  try { JSZip = await loadJSZip(); }
  catch(e) {
    set({ exporting:false,
      expMsg: e.message==='OFFLINE'
        ? '⚠️ Butuh internet sekali untuk load JSZip.'
        : '❌ Gagal load JSZip.' });
    return;
  }
  try {
    const zip = new JSZip();
    const f056 = zip.folder('Al-Waqiah');
    const f083 = zip.folder('Al-Muthaffifin');
    const full = zip.folder('full');
    let size=0, done=0;
    for (const {key,blob} of all) {
      size += blob.size; done++;
      set({ expProg:{cur:done,tot:all.length,size} });
      if      (key.startsWith('056-'))  f056.file(key.split('-')[1]+'.mp3', blob);
      else if (key.startsWith('083-'))  f083.file(key.split('-')[1]+'.mp3', blob);
      else if (key.startsWith('FULL-')) full.file(key.replace('FULL-','')+'.mp3', blob);
      if (done%10===0) await new Promise(r=>setTimeout(r,5));
    }
    zip.file('manifest.json', JSON.stringify({
      app:'quran-offline-player', version:1,
      exportedAt: new Date().toISOString(),
      totalFiles: all.length, totalSize: size
    },null,2));
    const blob = await zip.generateAsync({type:'blob',compression:'STORE'});
    const fname = `quran-offline-${new Date().toISOString().slice(0,10)}.zip`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    set({ exporting:false, expMsg:`✅ Export ${all.length} file (${fmtSize(blob.size)}) → ${fname}` });
  } catch(e) { set({exporting:false, expMsg:'❌ '+e.message}); }
}

// ── Import ────────────────────────────────────
async function importData(file) {
  if (!file || !file.name.endsWith('.zip')) {
    set({impMsg:'⚠️ File harus .zip hasil Export.'}); return;
  }
  set({ importing:true, impMsg:'', impProg:{cur:0,tot:0,name:'Memuat ZIP...'} });
  let JSZip;
  try { JSZip = await loadJSZip(); }
  catch(e) {
    set({ importing:false,
      impMsg: e.message==='OFFLINE'
        ? '⚠️ Butuh internet sekali untuk load JSZip.'
        : '❌ Gagal load JSZip.' });
    return;
  }
  try {
    const zip = await JSZip.loadAsync(file);
    const mp3s = Object.keys(zip.files)
      .filter(p => !zip.files[p].dir && p.toLowerCase().endsWith('.mp3'));
    if (!mp3s.length) {
      set({importing:false, impMsg:'❌ ZIP tidak valid: tidak ada .mp3.'}); return;
    }
    let ok=0, skip=0;
    for (let i=0; i<mp3s.length; i++) {
      const path = mp3s[i];
      set({ impProg:{cur:i,tot:mp3s.length,name:path} });
      try {
        const blob = await zip.files[path].async('blob');
        let key = '';
        if      (path.startsWith('Al-Waqiah/'))      key = '056-'+path.split('/').pop().replace('.mp3','').padStart(3,'0');
        else if (path.startsWith('Al-Muthaffifin/')) key = '083-'+path.split('/').pop().replace('.mp3','').padStart(3,'0');
        else if (path.startsWith('full/')) {
          const c = path.split('/').pop().replace('.mp3','');
          if (c==='056'||c==='083') key = 'FULL-'+c;
        }
        if (key) { await DB.put(key, blob); ok++; }
        else skip++;
      } catch { skip++; }
      if (i%5===0) await new Promise(r=>setTimeout(r,5));
    }
    await refreshCache();
    set({
      importing:false,
      impProg:{cur:mp3s.length,tot:mp3s.length,name:'Selesai'},
      impMsg:`✅ ${ok} file berhasil${skip?`, ${skip} dilewati`:''}.${ok?' Status jadi Offline ✅':''}`
    });
  } catch(e) { set({importing:false, impMsg:'❌ '+e.message}); }
}
</script>

            border-color:${S.autoNext?'#34d39930':'#52525b'};
            color:${S.autoNext?'#6ee7b7':'#a1a1aa'};">
          Auto-Next ${S.autoNext?'ON':'OFF'}
        </button>
      </div>

      <!-- List Ayat -->
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${surah.ayahs.map(ay => {
          const key    = `${surah.code}-${String(ay.n).padStart(3,'0')}`;
          const cached = !!S.cached[key];
          const active = S.ayah === ay.n;
          const playng = active && S.playing;
          return `
          <div id="ay-${ay.n}" data-n="${ay.n}"
            style="border-radius:16px;border:1px solid;padding:16px 20px;
              transition:all 0.2s;
              background:${active?'linear-gradient(135deg,#133528,#0e2a20)':'#0d2e2460'};
              border-color:${active?'#fbbf2440':'#ffffff0a'};">

            <!-- Header ayat -->
            <div style="display:flex;align-items:center;
              justify-content:space-between;gap:12px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="height:30px;width:30px;border-radius:10px;
                  display:grid;place-items:center;font-size:12px;
                  font-weight:700;border:1px solid;flex-shrink:0;
                  background:${active?'#fbbf24':'#021a14'};
                  border-color:${active?'#fcd34d':'#ffffff15'};
                  color:${active?'black':'#a1a1aa'};">
                  ${ay.n}
                </div>
                <span style="font-size:10px;padding:2px 8px;
                  border-radius:999px;border:1px solid;
                  background:${cached?'#10b98120':'#3f3f4620'};
                  border-color:${cached?'#34d39930':'#52525b30'};
                  color:${cached?'#6ee7b7':'#71717a'};">
                  ${cached?'offline ✅':'online'}
                </span>
              </div>
              <button class="btn-play" data-n="${ay.n}"
                style="height:34px;width:34px;border-radius:999px;
                  display:grid;place-items:center;border:1px solid;
                  cursor:pointer;transition:all 0.2s;
                  background:${playng?'#fbbf24':'#3f3f46'};
                  border-color:${playng?'#fcd34d':'#52525b'};
                  color:${playng?'black':'#e4e4e7'};
                  font-size:${playng?'14px':'12px'};">
                ${playng?'⏸':'▶'}
              </button>
            </div>

            <!-- Teks Arab -->
            <div class="arab"
              style="margin-top:12px;font-size:28px;line-height:2.2;
                color:#f5f1e8;">
              ${ay.a}
            </div>

            <!-- Latin -->
            <div style="margin-top:8px;font-size:12px;font-style:italic;
              color:#fde68a90;line-height:1.6;">
              ${ay.l}
            </div>

            <!-- Terjemahan -->
            <div style="margin-top:6px;font-size:13px;color:#d4d4d8;
              line-height:1.6;">
              ${ay.i}
            </div>

            <!-- Loading indicator -->
            ${active?`
            <div style="margin-top:10px;height:3px;border-radius:999px;
              background:#021a14;overflow:hidden;border:1px solid #ffffff08;">
              <div class="animate-shimmer"
                style="height:100%;width:100%;
                  background:linear-gradient(90deg,#fcd34d,#34d399,#fcd34d);
                  background-size:200% 100%;">
              </div>
            </div>`:''}
          </div>`;
        }).join('')}
      </div>

      <!-- Catatan -->
      <div style="margin-top:24px;border-radius:14px;background:#0a2a20;
        border:1px solid #ffffff08;padding:14px;font-size:11px;
        color:#71717a;line-height:1.7;">
        Audio: everyayah.com (Alafasy 128kbps) & mp3quran.net.
        Teks Arab + terjemahan sudah tersimpan di file ini (offline).
        Audio per-ayat tersimpan di IndexedDB browser.
        PWA ready — bisa Add to Home Screen.
      </div>
    </main>
  </div>
  `;

  // Bind events setelah render
  bindEvents(surah);

  // Simpan referensi node ayat untuk scroll
  surah.ayahs.forEach(ay => {
    ayahNodes[ay.n] = $(`ay-${ay.n}`);
  });

  // Pasang audio element
  audioEl = $('audioEl') || (() => {
    const a = document.createElement('audio');
    a.id = 'audioEl'; a.preload = 'none';
    a.style.display = 'none';
    document.body.appendChild(a);
    return a;
  })();
  audioEl.onended = () => {
    const s = SURAHS[S.tab];
    if (S.autoNext && S.ayah && S.ayah < s.count) play(S.ayah+1);
    else set({playing:false});
  };
  audioEl.onplay  = () => set({playing:true});
  audioEl.onpause = () => set({playing:false});
  audioEl.onerror = () => set({playing:false});
}

function bindEvents(surah) {
  // Tab
  $('tab-waqiah')?.addEventListener('click', () => {
    if (S.tab!=='waqiah') {
      audioEl?.pause();
      set({tab:'waqiah',ayah:null,playing:false});
    } else window.scrollTo({top:0,behavior:'smooth'});
  });
  $('tab-mutaf')?.addEventListener('click', () => {
    if (S.tab!=='mutaf') {
      audioEl?.pause();
      set({tab:'mutaf',ayah:null,playing:false});
    } else window.scrollTo({top:0,behavior:'smooth'});
  });

  // Panels
  $('btn-howto')?.addEventListener('click', () => set({showHowto:!S.showHowto}));
  $('btn-toggle-dl')?.addEventListener('click', () => set({showDl:!S.showDl}));
  $('btn-adv')?.addEventListener('click', () => set({showAdv:!S.showAdv}));

  // Download
  $('btn-dl')?.addEventListener('click', downloadAll);
  $('btn-dl2')?.addEventListener('click', downloadAll);

  // Hapus cache
  $('btn-clear')?.addEventListener('click', async () => {
    if (!confirm('Hapus semua audio offline?')) return;
    await DB.clear();
    audioEl?.pause();
    if (S.blobUrl) URL.revokeObjectURL(S.blobUrl);
    set({cached:{},count:{'056':0,'083':0},ayah:null,playing:false,blobUrl:null});
  });

  // Speed
  document.querySelectorAll('.spd').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = parseFloat(btn.dataset.v);
      set({speed:v});
      if (audioEl) audioEl.playbackRate = v;
    });
  });

  // Auto-next
  $('btn-auto')?.addEventListener('click', () => set({autoNext:!S.autoNext}));

  // Play buttons per ayat
  document.querySelectorAll('.btn-play').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = parseInt(btn.dataset.n);
      if (S.ayah===n && S.playing) { audioEl?.pause(); set({playing:false}); }
      else play(n);
    });
  });

  // Player bar
  $('btn-prev')?.addEventListener('click', () => {
    if (S.ayah && S.ayah>1) play(S.ayah-1);
  });
  $('btn-next')?.addEventListener('click', () => {
    if (S.ayah && S.ayah<surah.count) play(S.ayah+1);
  });
  $('btn-pp')?.addEventListener('click', () => {
    if (!S.ayah) { play(1); return; }
    if (S.playing) { audioEl?.pause(); set({playing:false}); }
    else audioEl?.play().then(()=>set({playing:true})).catch(()=>{});
  });

  // Export/Import
  $('btn-export')?.addEventListener('click', exportData);
  $('btn-import')?.addEventListener('click', () => $('file-import')?.click());
  $('file-import')?.addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) importData(f);
    e.target.value='';
  });
}
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 5: PLAYER BAR (fixed bottom)
═══════════════════════════════════════════ -->
<script>
function renderPlayerBar() {
  let bar = $('player-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'player-bar';
    bar.style.cssText = `
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      border-top:1px solid #78350f30;
      background:#041f17f5;backdrop-filter:blur(20px);
    `;
    document.body.appendChild(bar);
  }
  const surah = SURAHS[S.tab];
  const info  = S.ayah ? surah.ayahs[S.ayah-1] : null;
  bar.innerHTML = `
    <div style="max-width:980px;margin:0 auto;
      padding:10px 16px;display:flex;align-items:center;gap:12px;">
      <div style="height:40px;width:40px;border-radius:12px;
        background:linear-gradient(135deg,#fcd34d,#d97706);
        display:grid;place-items:center;color:black;
        font-weight:700;font-size:15px;flex-shrink:0;">
        ${S.ayah ? String(S.ayah).padStart(2,'0') : '—'}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          ${info ? `${surah.name} • Ayat ${S.ayah}` : 'Pilih ayat untuk diputar'}
        </div>
        <div style="font-size:11px;color:#a1a1aa;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          ${info ? info.i.slice(0,65)+'…' : S.online?'Streaming jika online':'Putar dari cache'}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <button id="btn-prev"
          style="height:36px;width:36px;border-radius:999px;
            background:#3f3f46;border:1px solid #52525b;
            display:grid;place-items:center;cursor:pointer;
            color:#e4e4e7;font-size:14px;">
          ⏮
        </button>
        <button id="btn-pp"
          style="height:40px;width:40px;border-radius:999px;
            background:#fbbf24;color:black;
            border:1px solid #fcd34d;
            display:grid;place-items:center;cursor:pointer;
            font-size:18px;">
          ${S.playing?'⏸':'▶'}
        </button>
        <button id="btn-next"
          style="height:36px;width:36px;border-radius:999px;
            background:#3f3f46;border:1px solid #52525b;
            display:grid;place-items:center;cursor:pointer;
            color:#e4e4e7;font-size:14px;">
          ⏭
        </button>
      </div>
    </div>
  `;
}

// Override set agar player bar ikut update
const _origSet = set;
// eslint-disable-next-line no-global-assign
set = function(patch) {
  Object.assign(S, patch);
  render();
  renderPlayerBar();
};
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 6: PWA
═══════════════════════════════════════════ -->
<script>
const PWA = {
  deferredPrompt: null,
  swReg: null,
  installed: false,

  async init() {
    this.manifest();
    await this.sw();
    this.listenPrompt();
    this.checkInstalled();
    this.listenInstalled();
  },

  manifest() {
    const svg = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="80" fill="#064e3b"/>
      <text x="256" y="310" font-size="260" text-anchor="middle" fill="white">📖</text>
    </svg>`);
    const icon = `data:image/svg+xml,${svg}`;
    const data = {
      name: "Al-Qur'an Offline",
      short_name: "Al-Qur'an",
      description: "Al-Waqiah & Al-Muthaffifin offline",
      start_url: "./",
      scope: "./",
      display: "standalone",
      orientation: "portrait",
      background_color: "#021a14",
      theme_color: "#064e3b",
      icons: [
        {src:icon, sizes:"192x192", type:"image/svg+xml", purpose:"any maskable"},
        {src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}
      ]
    };
    const link = $('manifest-link');
    if (link) link.href = URL.createObjectURL(
      new Blob([JSON.stringify(data)], {type:'application/manifest+json'})
    );
  },

  async sw() {
    if (!('serviceWorker' in navigator)) return;
    const code = `
      const C='quran-v4';
      self.addEventListener('install',e=>{
        e.waitUntil(caches.open(C).then(c=>c.addAll(['./']).catch(()=>{})).then(()=>self.skipWaiting()));
      });
      self.addEventListener('activate',e=>{
        e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
      });
      self.addEventListener('fetch',e=>{
        const u=new URL(e.request.url);
        if(['everyayah.com','mp3quran.net','cdnjs.cloudflare.com','fonts.g'].some(h=>u.hostname.includes(h)))return;
        if(e.request.method!=='GET')return;
        e.respondWith(
          caches.match(e.request).then(r=>{
            if(r){fetch(e.request).then(n=>{if(n.ok)caches.open(C).then(c=>c.put(e.request,n))}).catch(()=>{});return r;}
            return fetch(e.request).then(n=>{if(n.ok){const cl=n.clone();caches.open(C).then(c=>c.put(e.request,cl));}return n;}).catch(()=>caches.match('./'));
          })
        );
      });
    `;
    try {
      this.swReg = await navigator.serviceWorker.register(
        URL.createObjectURL(new Blob([code],{type:'text/javascript'})),
        {scope:'./'}
      );
    } catch(e) { console.warn('[SW]',e); }
  },

  listenPrompt() {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.deferredPrompt = e;
      // Tampilkan tombol install
      const btn = $('btn-install');
      if (btn) btn.style.display = 'flex';
    });
  },

  checkInstalled() {
    const standalone =
      window.matchMedia('(display-mode:standalone)').matches ||
      window.navigator.standalone === true;
    if (standalone) {
      this.installed = true;
      const btn = $('btn-install');
      if (btn) btn.style.display = 'none';
    }
  },

  async triggerInstall() {
    if (!this.deferredPrompt) {
      this.showGuide(); return;
    }
    this.deferredPrompt.prompt();
    const {outcome} = await this.deferredPrompt.userChoice;
    if (outcome==='accepted') {
      const btn = $('btn-install');
      if (btn) btn.style.display = 'none';
    }
    this.deferredPrompt = null;
  },

  showGuide() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const safr = /safari/i.test(navigator.userAgent) && !/chrome/i.test(navigator.userAgent);
    const msg = ios && safr
      ? `<ol style="line-height:2.2;font-size:13px;">
           <li>Tap tombol <b>Share ⬆️</b> di Safari</li>
           <li>Pilih <b>"Add to Home Screen"</b></li>
           <li>Tap <b>"Add"</b></li>
         </ol>`
      : `<ol style="line-height:2.2;font-size:13px;">
           <li>Tap menu <b>⋮</b> di Chrome</li>
           <li>Pilih <b>"Add to Home screen"</b></li>
           <li>Tap <b>"Add"</b></li>
         </ol>`;
    const modal = document.createElement('div');
    modal.style.cssText = `position:fixed;inset:0;background:#00000080;
      z-index:99999;display:flex;align-items:flex-end;
      justify-content:center;padding:16px;backdrop-filter:blur(4px);`;
    modal.innerHTML = `
      <div style="background:#1c1c2e;border:1px solid #ffffff20;
        border-radius:20px 20px 16px 16px;padding:24px;
        width:100%;max-width:480px;color:white;">
        <div style="text-align:center;margin-bottom:16px;font-size:36px;">📱</div>
        <div style="font-weight:700;font-size:15px;
          margin-bottom:12px;text-align:center;">
          Install Al-Qur'an Offline
        </div>
        ${msg}
        <button onclick="this.closest('div[style*=fixed]').remove()"
          style="margin-top:16px;width:100%;padding:12px;
            border-radius:12px;background:#064e3b;color:white;
            border:none;font-size:14px;font-weight:600;cursor:pointer;">
          Mengerti
        </button>
      </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });
  },

  listenInstalled() {
    window.addEventListener('appinstalled', () => {
      this.installed = true;
      const btn = $('btn-install');
      if (btn) btn.style.display = 'none';
    });
  }
};

window.PWA = PWA;
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 7: INIT (jalankan semua)
═══════════════════════════════════════════ -->
<script>
async function init() {
  // Online/offline
  window.addEventListener('online',  () => set({online:true}));
  window.addEventListener('offline', () => set({online:false}));

  // Storage estimate
  async function updateStorage() {
    if (navigator.storage?.estimate) {
      const {usage} = await navigator.storage.estimate();
      const s = usage ? (usage/1048576).toFixed(1)+' MB' : '-';
      if (s !== S.storage) set({storage:s});
    }
  }
  updateStorage();
  setInterval(updateStorage, 5000);

  // Load cache state dari DB
  await refreshCache();

  // Render pertama
  render();
  renderPlayerBar();

  // PWA
  PWA.init();
}

// Jalankan saat DOM siap
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
